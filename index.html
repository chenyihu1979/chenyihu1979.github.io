<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4ff">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>陈聚灏学习中心</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18324a;
      --muted: #5e7284;
      --card: rgba(255, 255, 255, .9);
      --line: #d8e6f0;
      --blue: #2d73b9;
      --blue-dark: #1f568e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.95), transparent 32%),
        linear-gradient(135deg, #e8f4ff 0%, #f8fbff 52%, #eef9f4 100%);
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero {
      padding: clamp(26px, 6vw, 64px) clamp(20px, 6vw, 64px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 28px;
      background: rgba(255,255,255,.68);
      box-shadow: 0 18px 48px rgba(43, 92, 128, .12);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 14px;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1.15;
      letter-spacing: .04em;
    }

    .intro {
      max-width: 660px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2.2vw, 19px);
      line-height: 1.8;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .subject {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(43, 92, 128, .09);
    }

    .subject-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #e7f2ff;
      font-size: 29px;
    }

    .subject h2 {
      margin: 18px 0 8px;
      font-size: clamp(21px, 3vw, 28px);
    }

    .subject p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .subject a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: auto;
      padding: 10px 18px;
      border-radius: 13px;
      color: #fff;
      background: var(--blue);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }

    .subject a:hover, .subject a:focus-visible {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .note {
      margin: 24px 0 0;
      padding: 16px 18px;
      border-left: 4px solid #7fb6d8;
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255,255,255,.62);
      line-height: 1.7;
      text-align: center;
    }

    footer {
      padding-top: 24px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 680px) {
      main { width: min(100% - 20px, 560px); padding-top: 10px; }
      .subjects { grid-template-columns: 1fr; }
      .subject { min-height: 200px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <p class="eyebrow">LEARNING LABORATORY</p>
      <h1 id="title">陈聚灏学习中心</h1>
      <p class="intro">把数学与自然科学变成可以观察、操作、思考和练习的学习实验室。</p>
    </section>

    <section class="subjects" aria-label="学习内容">
      <article class="subject">
        <div class="subject-icon" aria-hidden="true">∠</div>
        <h2>初中数学实验室</h2>
        <p>覆盖几何、函数、统计与概率等多个知识模块，支持动手探索和互动练习。</p>
        <a href="./chen-juhao-junior-math-lab/">进入数学实验室&nbsp;→</a>
      </article>

      <article class="subject">
        <div class="subject-icon" aria-hidden="true">⚗</div>
        <h2>初中化学元素导航中心</h2>
        <p>CB02 元素导航中心：认识元素、观察真实图像、学习符号规律并完成小闯关。</p>
        <a href="./chemistry/cb02/index.html">进入化学元素中心&nbsp;→</a>
      </article>
    </section>

    <p class="note">本中心不含广告、搜索引擎、统计代码或社交链接。学习材料尽量使用本地资源，适合在受限网络环境中使用。</p>
    <footer>© 陈聚灏学习中心</footer>
  </main>
</body>
</html>
