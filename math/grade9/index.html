<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>九年级数学动态实验室</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--line:#dce3ec;--ink:#1e293b;--muted:#64748b;--blue:#2563eb;--blue-soft:#eff6ff;--green:#059669;--amber:#d97706;--violet:#7c3aed;--red:#dc2626;--topScale:1;--canvasScale:1.15;--sideScale:1;--bottomScale:1;--sideWidth:348px;--bottomHeight:76px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:minmax(0,1fr) 8px var(--bottomHeight);height:100vh;min-height:420px}
.main{display:grid;grid-template-columns:minmax(420px,1fr) 8px var(--sideWidth);min-height:0}
.canvasPane{position:relative;min-width:0;min-height:0;background:#fbfcfe;overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none;user-select:none}
#scene [data-drag]{cursor:grab;touch-action:none}
#scene [data-drag]:active{cursor:grabbing}
.topbar{position:absolute;z-index:5;top:10px;left:12px;right:12px;display:flex;align-items:flex-start;gap:8px;pointer-events:none;font-size:calc(13px * var(--topScale))}
.topbar>*{pointer-events:auto}
.topbar a,.topbar button,.fit{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.94);color:var(--muted);padding:7px 11px;text-decoration:none;white-space:nowrap;box-shadow:0 1px 2px #0f172a0b}
.topbar a:hover,.topbar button:hover,.fit:hover{border-color:#93c5fd;color:var(--blue);background:#fff}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:min(56vw,560px);padding:2px 6px;line-height:1.25;text-shadow:0 1px 0 #fff}
.meta .id{font-size:.8em;color:#94a3b8}
.meta .topic{font-size:1.12em;font-weight:750;overflow-wrap:anywhere}
.fit{position:absolute;right:0;top:0}
.sideSplitter,.bottomSplitter{background:#d8e0ea;z-index:10;position:relative}
.sideSplitter{cursor:col-resize}
.bottomSplitter{cursor:row-resize}
.sideSplitter:hover,.sideSplitter.active,.bottomSplitter:hover,.bottomSplitter.active{background:var(--blue)}
.sidebar{min-width:260px;min-height:0;overflow:auto;background:var(--surface);border-left:1px solid var(--line);padding:14px calc(14px * var(--sideScale));font-size:calc(14px * var(--sideScale));overflow-wrap:anywhere}
.sideTitle{font-size:1.2em;font-weight:800;color:var(--blue);margin:0 0 4px}
.sideHint{color:var(--muted);font-size:.86em;margin:0 0 12px;line-height:1.5}
.groupTitle{font-size:.82em;font-weight:800;color:#94a3b8;letter-spacing:.06em;margin:16px 0 7px;padding-top:8px;border-top:1px solid #edf1f5}
.topicButton{display:flex;width:100%;gap:7px;align-items:flex-start;text-align:left;border:1px solid transparent;background:#fff;border-radius:8px;padding:8px 9px;margin:4px 0;color:var(--ink);line-height:1.35}
.topicButton:hover{background:var(--blue-soft);border-color:#bfdbfe}
.topicButton.active{background:#eaf2ff;border-color:#93c5fd;color:#1d4ed8}
.topicButton.done{border-right:4px solid #34d399}
.topicCode{font-size:.78em;font-weight:800;color:#94a3b8;min-width:54px}
.topicButton.active .topicCode{color:var(--blue)}
.topicName{font-weight:650;flex:1}
.section{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.section h3{font-size:1em;margin:0 0 8px;color:#475569}
.fact{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9;line-height:1.35}
.fact span:first-child{color:var(--muted)}
.fact strong{text-align:right;color:#0f766e}
.control{display:grid;grid-template-columns:82px minmax(0,1fr) 48px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9}
.control label{color:#475569}
.control input[type=range]{width:100%;accent-color:var(--blue)}
.control output{font-weight:750;text-align:right;color:var(--blue)}
.miniButton,.stageButton,.answerButton,.actionButton{border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 9px;color:#475569}
.miniButton:hover,.stageButton:hover,.answerButton:hover,.actionButton:hover{border-color:#93c5fd;color:var(--blue)}
.controlActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.stageGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stageButton{font-size:.86em;padding:7px 5px}
.stageButton.active{background:var(--blue);border-color:var(--blue);color:#fff}
.guideBox{background:#f8fafc;border:1px solid #e7edf4;border-radius:9px;padding:10px 11px;line-height:1.65}
.guideBox b{color:#334155}
.tip{margin-top:9px;padding:8px 10px;border-radius:8px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;line-height:1.5}
.challengeBox{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:9px;padding:10px;line-height:1.6}
.answerRow{display:flex;gap:6px;margin-top:8px}
.answerRow input{min-width:0;flex:1;border:1px solid #c4b5fd;border-radius:6px;padding:6px 8px}
.success{color:#047857;font-weight:750}
.footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 12px;background:#fff;border-top:1px solid var(--line);font-size:calc(12px * var(--bottomScale));overflow:auto}
.footer button{border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 10px;color:#475569;white-space:nowrap}
.footer button:hover{border-color:#93c5fd;color:var(--blue)}
.footer button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.footer .sep{color:#cbd5e1}
.fontGroup{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px 4px;border:1px solid #dbeafe;background:#f8fbff;color:#1d4ed8;white-space:nowrap}
.fontGroup.side{border-color:#ddd6fe;background:#faf5ff;color:#7c3aed}
.fontGroup.bottom{border-color:#bbf7d0;background:#f0fdf4;color:#15803d}
.fontGroup.top{border-color:#fed7aa;background:#fff7ed;color:#c2410c}
.fontGroup button{border:0!important;background:transparent!important;padding:2px 6px!important;color:inherit!important}
.fontValue{min-width:30px;text-align:center;font-weight:700}
#status{flex:1;min-width:140px;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modalBack{position:fixed;inset:0;background:#0f172a55;z-index:50;display:grid;place-items:center;padding:18px}
.modal{width:min(680px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 18px 60px #0f172a33;line-height:1.7;font-size:calc(15px * var(--sideScale))}
.modal h2{margin:0 0 10px;color:var(--blue)}
.modal .close{float:right;border:0;background:#eff6ff;color:var(--blue);border-radius:6px;padding:4px 9px}
.pulse{animation:pulse .7s ease}
@keyframes pulse{0%{opacity:.55}100%{opacity:1}}
@media(max-width:980px){.main{grid-template-columns:minmax(360px,1fr) 8px var(--sideWidth)}.sidebar{padding:10px}.footer{padding-left:7px;padding-right:7px}.fontGroup{gap:0}}
@media(max-width:760px){.app{min-height:560px}.main{grid-template-columns:1fr;grid-template-rows:minmax(340px,1fr) 8px minmax(210px,34vh)}.sideSplitter{display:none}.sidebar{border-left:0;border-top:1px solid var(--line);min-width:0}.bottomSplitter{display:block}.topbar{left:7px;right:7px;top:7px;gap:4px}.topbar a,.topbar button{padding:6px 8px}.meta{max-width:55vw}.footer{font-size:calc(11px * var(--bottomScale))}.footer .sep{display:none}}
@media(max-width:520px){.topbar a,.topbar button{font-size:.9em;padding:5px 6px}.meta .topic{font-size:1em}.fit{right:0}.footer #status{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var stages=[
  {key:'guide',name:'总览',icon:'📘'},
  {key:'predict',name:'预测',icon:'🔮'},
  {key:'experiment',name:'实验',icon:'🧪'},
  {key:'discover',name:'发现',icon:'⭐'},
  {key:'explain',name:'解释',icon:'💡'},
  {key:'counter',name:'反例',icon:'⚠️'},
  {key:'challenge',name:'挑战',icon:'🎯'}
];
var topics=[
 {code:'F04-01',group:'二次函数',title:'二次函数 y=ax²：开口与宽窄',renderer:'parabola',goal:'只改变 a，观察开口方向与收拢程度。',formula:'y = a(x−h)² + k',params:{a:1,h:0,k:0},concept:'a 的符号决定开口方向，|a|决定图像的“胖瘦”；顶点是 (h,k)，对称轴是 x=h。',predict:['a 从 1 变为 −1，开口会怎样？','|a| 变大时，图像会更靠近对称轴还是更展开？'],answers:['向下','更靠近'],why:'同一个 x 离对称轴的距离为 d 时，y−k=a·d²；a 改变符号会翻转，绝对值变大则纵向变化更快。',counter:'a=0 时图像变成直线 y=k，不再是二次函数。',challenge:'将顶点移到 (2,−1)，并让图像开口向下。你需要怎样设置 a、h、k？',target:'a<0，h=2，k=−1',exam:'利用顶点式读出顶点、对称轴和最值。'},
 {code:'F04-02',group:'二次函数',title:'顶点式：平移与顶点',renderer:'parabola',goal:'拖动 h、k，观察顶点和对称轴同步移动。',formula:'y = a(x−h)² + k',params:{a:1,h:2,k:-1},concept:'h 控制左右平移，k 控制上下平移；顶点为 (h,k)，对称轴为 x=h。',predict:['h 增大，顶点向哪边移动？','k 减小，最低点会怎样？'],answers:['右','下降'],why:'令 x=h 时，平方项为 0，所以 y=k；这直接给出顶点坐标。',counter:'不要把 (x−h) 中的 h 读成顶点的横坐标 −h。',challenge:'让顶点为 (−2,3)，且开口向上。',target:'a>0，h=−2，k=3',exam:'由顶点坐标写出函数关系，并判断最值。'},
 {code:'F04-03',group:'二次函数',title:'一般式：参数 a、b、c',renderer:'general',goal:'改变一般式的参数，比较 y 轴截距、顶点和对称轴。',formula:'y = ax² + bx + c',params:{a:1,b:-2,c:-3},concept:'c 是 y 轴截距；对称轴为 x=−b/(2a)，顶点纵坐标由代入函数求得。',predict:['只改变 c，哪一个量一定会改变？','a、b 不变，只增大 c，两条图像有什么关系？'],answers:['y轴截距','竖直平移'],why:'x=0 时 y=c；加上常数只会让每个函数值同时加同一个数。',counter:'对称轴不是 x=−b/a，而是 x=−b/(2a)。',challenge:'将函数设置为 y=x²−4x+3，使它与 x 轴有两个交点。',target:'a=1，b=−4，c=3',exam:'结合对称轴、顶点与判别式综合读图。'},
 {code:'F04-04',group:'二次函数',title:'零点与判别式 Δ',renderer:'roots',goal:'改变 a、b、c，观察抛物线与 x 轴交点个数。',formula:'Δ=b²−4ac',params:{a:1,b:0,c:-2},concept:'Δ>0 有两个不相等实根，Δ=0 有一个实根，Δ<0 没有实根；图像上对应 2、1、0 个 x 轴交点。',predict:['把 c 从 −2 调到 0，交点个数会怎样？','Δ<0 时抛物线会穿过 x 轴吗？'],answers:['从2个变为1个','不会'],why:'一元二次方程的根就是函数图像与 x 轴交点的横坐标。',counter:'Δ=0 不是“没有根”，而是有两个相等的根。',challenge:'调出“只有一个 x 轴交点”的状态。',target:'使 Δ=0',exam:'由交点个数反推参数范围或判别式。'},
 {code:'F04-05',group:'二次函数',title:'最值与实际建模',renderer:'model',goal:'把抛物线的顶点看成实际问题中的最大值或最小值。',formula:'顶点 = 最值位置',params:{a:-0.18,h:5,k:4},concept:'开口向上时顶点给最小值，开口向下时顶点给最大值；实际问题还要检查自变量取值范围。',predict:['a<0 时顶点表示最大值还是最小值？','如果实际 x 只能在 0 到 8 之间，顶点在区间外还能直接用吗？'],answers:['最大值','不能'],why:'抛物线的顶点是函数在全部实数范围内的极值；实际题还要比较区间端点。',counter:'顶点是数学最值，题目的定义域可能会排除顶点。',challenge:'把模型设为“x=5 时达到最高 4”，并判断最高点。',target:'h=5，k=4，a<0',exam:'利润、面积、拱桥和投掷问题中的最值。'},
 {code:'F03-01',group:'反比例函数',title:'反比例函数 y=k/x：象限',renderer:'reciprocal',goal:'改变 k 的正负和大小，观察双曲线所在象限。',formula:'xy = k（x≠0）',params:{k:4,x:2},concept:'k>0 时图像在第一、三象限；k<0 时在第二、四象限；同一支上 y 随 x 变化的方向相反。',predict:['k 从正变负，图像会转到哪些象限？','x 变大时，同一支上的 y 会变大还是变小？'],answers:['二、四','变小'],why:'xy=k 的符号决定 x、y 同号还是异号；x 增大时 y=k/x 的绝对值减小。',counter:'x=0 不在定义域，双曲线不会穿过坐标轴。',challenge:'让动点位于第二象限，并保持 xy=−4。',target:'k<0，x<0',exam:'象限、增减性、反比例图像与一次函数交点。'},
 {code:'F03-02',group:'反比例函数',title:'k 的几何意义：矩形面积',renderer:'reciprocal',goal:'拖动点 P，验证坐标轴与双曲线围成矩形的面积。',formula:'S矩形 = |x·y| = |k|',params:{k:4,x:2},concept:'点 P(x,y) 在 y=k/x 上时，x·y=k；矩形面积取正，因此 S=|k|。',predict:['P 沿同一支移动，矩形面积会改变吗？','k=-6 时，面积能是 −6 吗？'],answers:['不会','不能'],why:'P 的每一组坐标都满足 xy=k，横边与竖边乘积恒定；面积必须取正。',counter:'有向积 xy 可以为负，但几何面积不会为负。',challenge:'把面积调为 6，并让 P 在第四象限。',target:'|k|=6，x>0，y<0',exam:'利用面积、坐标和 k 的关系反求参数。'},
 {code:'C03-02',group:'相似与三角函数',title:'相似三角形：对应边成比例',renderer:'similar',goal:'改变相似比，观察对应边和面积如何变化。',formula:'对应边比相等；面积比 = 相似比²',params:{scale:.55},concept:'两三角形相似时，对应角相等、对应边成比例；若边长比为 m，面积比为 m²。',predict:['相似比从 0.5 变为 1，图形会怎样？','边长比为 2，面积比是多少？'],answers:['变得一样大','4'],why:'底和高都乘以 m，面积 = 底×高÷2 就会乘以 m²。',counter:'边长比与面积比不是同一个数。',challenge:'将小三角形面积比调到大三角形的 1/4。',target:'相似比 m=0.5',exam:'相似模型、比例线段、测高和面积比。'},
 {code:'C03-06',group:'相似与三角函数',title:'锐角三角函数：sin、cos、tan',renderer:'trig',goal:'改变锐角，观察三条边和三角函数值。',formula:'sinθ=对/斜，cosθ=邻/斜，tanθ=对/邻',params:{angle:35,hyp:8},concept:'在同一个锐角中，三角函数值只由角度决定，与三角形大小无关。',predict:['角度变大，sinθ 会怎样？','斜边扩大但角度不变，tanθ 会改变吗？'],answers:['变大','不会'],why:'相似直角三角形的对应边同比例变化，比值保持不变。',counter:'tanθ 不是“对边÷斜边”，而是对边÷邻边。',challenge:'将 θ 调为 30°，观察 sinθ≈0.5。',target:'angle=30°',exam:'用三角函数解决高度、距离和坡度问题。'},
 {code:'C03-07',group:'相似与三角函数',title:'解直角三角形：由角求高',renderer:'trig',goal:'把测得的角度和距离转化为高度。',formula:'高 = 距离 × tanθ',params:{angle:40,hyp:7},concept:'先辨认已知边相对哪个角，再选择 sin、cos 或 tan；单位要统一。',predict:['同样的水平距离，仰角变大，高度会怎样？','知道斜边和角，求对边应使用哪个比值？'],answers:['变大','sin'],why:'tanθ=对边/邻边，所以对边=邻边×tanθ；这是测高模型。',counter:'角度必须是题目中对应的锐角，不能随意换成另一个角。',challenge:'用 10m 水平距离和 45° 仰角估计高度。',target:'高 = 10m',exam:'仰角俯角、坡度、建筑测高。'},
 {code:'D03-02',group:'概率与统计',title:'等可能事件：理论概率',renderer:'probability',goal:'调整有利结果数与总结果数，理解概率是比例。',formula:'P(A)=有利结果数/所有等可能结果数',params:{fav:1,total:2},concept:'概率在 0 和 1 之间；必然事件概率为 1，不可能事件概率为 0。',predict:['有利结果数增加，概率一定增大吗？','总结果数为 6，有利结果为 2，概率是多少？'],answers:['在总数不变时','1/3'],why:'概率是有利结果在所有等可能结果中的占比。',counter:'只有在所有基本结果等可能时，才能直接用数数法。',challenge:'设置成掷骰子得到偶数的模型：3 个有利结果、6 个总结果。',target:'3/6=1/2',exam:'列表法、树状图、等可能事件。'},
 {code:'D03-06',group:'概率与统计',title:'频率估计概率：重复试验',renderer:'probability',goal:'重复抽样，观察频率在概率附近波动。',formula:'频率 = 事件发生次数/试验次数',params:{fav:1,total:2},concept:'试验次数越多，频率通常越接近理论概率，但每次结果仍有随机波动。',predict:['只做 2 次试验，频率会稳定吗？','点击“重复 50 次”，频率一定恰好等于概率吗？'],answers:['不会','不一定'],why:'随机性使频率上下波动；大量重复试验体现稳定性。',counter:'频率接近概率不是说每一小组试验都相等。',challenge:'连续进行多组 50 次试验，比较频率的变化。',target:'观察频率逐渐稳定',exam:'用频率估计概率、解释实验数据。'},
 {code:'D02-01',group:'概率与统计',title:'数据特征：平均数、中位数、极差',renderer:'stats',goal:'改变一个数据，比较平均数、中位数和极差的敏感程度。',formula:'平均数=总和/个数；极差=最大值−最小值',params:{last:12},concept:'平均数会被极端值拉动；中位数受单个极端值影响较小；极差只看两端。',predict:['把一个数据调得很大，平均数会怎样？','排序后中间位置的数叫做什么？'],answers:['增大','中位数'],why:'平均数把总和平均分配，任何一个数据变化都会影响总和；中位数看排序位置。',counter:'中位数不是“所有数相加再除以个数”。',challenge:'让极差尽可能大，同时观察平均数变化。',target:'拖动最后一个数据点',exam:'选择恰当统计量描述一组数据。'},
 {code:'C06-06',group:'图形与视图',title:'投影与三视图：从立体到平面',renderer:'projection',goal:'改变立体图的高度与深度，比较主视图、俯视图和左视图。',formula:'三视图：主视、俯视、左视',params:{height:3,depth:2},concept:'三视图要从同一物体观察；主视图看长和高，俯视图看长和宽，左视图看宽和高。',predict:['增加高度，哪个视图的高度会改变？','俯视图主要反映哪两个方向？'],answers:['主视图和左视图','长和宽'],why:'每个视图保留观察方向上的两个尺寸，第三个方向被投影重合。',counter:'三视图的位置和尺寸对应有规则，不能把三个图随意拼接。',challenge:'调整积木柱的高度，找出只改变主视图与左视图的效果。',target:'改变 height',exam:'由三视图判断几何体、求表面积和体积。'},

function fit(){if(scene){scene.classList.remove('pulse');void scene.offsetWidth;scene.classList.add('pulse');status.textContent='🎯 观察视图已居中，数学参数没有改变。'}}
function showGuide(){var t=current(),back=document.createElement('div');back.className='modalBack';back.innerHTML='<div class="modal"><button class="close">关闭</button><h2>📘 '+esc(t.code)+' '+esc(t.title)+'</h2><p><b>你已经会什么：</b>初步认识坐标、函数或图形中的量。</p><p><b>你要亲手做什么：</b>'+esc(t.goal)+'</p><p><b>重点观察什么：</b>参数改变后，哪些量保持不变，哪些量跟着变化。</p><p><b>带着什么问题：</b>'+esc(t.predict[0])+'</p><p><b>学完应该会什么：</b>'+esc(t.concept)+'</p><p><b>易错提醒：</b>'+esc(t.counter)+'</p><button class="actionButton startGuide">开始实验</button></div>';document.body.appendChild(back);back.querySelector('.close').onclick=function(){back.remove()};back.querySelector('.startGuide').onclick=function(){back.remove();state.stage='experiment';state.mode='FREE';render()}}
function init(){app=document.getElementById('app');var backHome=document.querySelector('.topbar a');if(backHome)backHome.href=/\/math\//.test(location.pathname)?'../index.html':'../柳州初中数学动态实验室/index.html';try{state.done=JSON.parse(localStorage.getItem('math-lab-done')||'{}')}catch(e){state.done={}}var q=new URLSearchParams(location.search).get('topic')||location.hash.slice(1);var wanted=topics.findIndex(function(t){return t.code===q});if(wanted>=0)state.topic=wanted;resetParams();shell()}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
